name: Apollo V2 CI

on:
  pull_request:
    paths:
      - "apollo-v2/**"
      - ".github/workflows/apollo-v2-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apollo-v2-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apollo-v2

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apollo-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web client
        run: npm run build:web
        env:
          VITE_REVIEW_KEY: ci-placeholder-not-a-production-secret
